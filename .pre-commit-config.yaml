repos:
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: ^src/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args:
          - "--warn-return-any"
          - "--warn-unused-ignores"
          - "--ignore-missing-imports"
          - "--disallow-untyped-defs"
          - "--check-untyped-defs"
        files: ^src/