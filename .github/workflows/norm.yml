name: Norm

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install flake8 mypy

      - name: Show environment versions
        run: |
          python --version
          python -m mypy --version
          python -c "import pydantic; print('Pydantic:', pydantic.__version__)"

      - name: Run flake8
        run: flake8 src/

      - name: Run mypy
        run: mypy src/ --warn-return-any --warn-unused-ignores --ignore-missing-imports --disallow-untyped-defs --check-untyped-defs
